.del { top: -14px; right: 0; background: #e8452c; color: #fff; }

.ins { position: static; background: #1f9d4c; color: #fff; }

.crate.active .wells { border-color: var(--ink); }

    ...(busy ? [h("button", { class: "stopbtn", onclick: Stop, "aria-label": "stop" }, [text("■ stop")])] : []),
    // focus view: one large byte over everything else; a click/tap outside it closes
    ...(zoomed ? [h("div", { class: "zoomview", onclick: ZoomAway }, [
      h("button", { class: "zstep", disabled: focusK(s) === 0, onclick: [ZoomStep, -1], "aria-label": "previous character" }, [text("◀")]),
      Crate(s, s.crates[focusK(s)], focusK(s)),
      h("button", { class: "zstep", disabled: focusK(s) >= s.crates.length - 1, onclick: [ZoomStep, 1], "aria-label": "next character" }, [text("▶")]),
      h("div", { class: "zhint" }, [text("click or tap outside the byte, or press Esc, to close")]),
    ])] : []),
  ]);
};

app({
  node: document.getElementById("app"),
  init: [
    { crates: [blank()], pos: maxPos(1), mode: "font", help: null, zoom: false, zk: null, text: "", phase: "idle", paused: false, resumeIn: null, lastTick: 0, paint: null, drag: null, cur: null, data: null,
      bits: [], arrived: {}, next: 0, seq: 0, out: [], partial: [], speed: 8, modem: false, noise: 0, raw: false, markers: false },
    [global],
  ],
  view,
  subscriptions: (s) => [s.phase === "play" && !s.paused && [clock, { ms: Math.round(1000 / s.speed), first: s.resumeIn }]],
});

})();
</script>
