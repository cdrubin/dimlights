<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Network2: loading a web page</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--line:#d8d8de;--panel:#f6f7f9;--chrome:#e6e8ec;--acc:#0a6cff;--good:#1a8a3a;--hit:#fff3b0;

@media(prefers-color-scheme:dark){:root{--bg:#16161a;--fg:#ececf0;--mut:#9a9aa3;--line:#33333b;--panel:#1e1e24;--chrome:#2a2a32;--acc:#6aa5ff;--good:#4cc46f;--hit:#5a4d10;
--dns:#a78bfa;--html:#60a5fa;--css:#f472b6;--img:#fb923c;--svg:#2dd4bf;--tag:#2dd4bf;--att:#c084fc;--str:#fb923c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:8px 16px 40px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}.top h1{font-size:22px;margin:0}
.back{color:var(--acc);text-decoration:none}
.m,.muted{color:var(--mut)}
.btn{font:inherit;font-size:15px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.small{padding:4px 10px;font-size:14px}.btn.on{border-color:var(--acc);color:var(--acc)}
.win{position:absolute;z-index:2;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.tabs{padding:8px 10px 0;background:var(--chrome);min-height:40px}
.tab{display:inline-flex;gap:8px;align-items:center;max-width:100%;background:var(--panel);padding:6px 12px;border-radius:8px 8px 0 0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
.dot.spin{background:none;border:2px solid var(--acc);border-top-color:transparent;animation:spin .8s linear infinite}

.urlrow{display:flex;gap:8px;padding:8px 10px}
.url-in{flex:1;min-width:0;font:inherit;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.url-in:focus{outline:2px solid var(--acc);outline-offset:0}
.bar{height:3px;background:var(--line)}.bar-in{height:100%;background:var(--acc)}
.viewwrap{position:relative;flex:1 1 auto;min-height:140px;display:flex}
.view{flex:1;width:100%;border:0;background:#fff;display:block}
.hl-frame{position:absolute;inset:0;border:4px solid #f59e0b;pointer-events:none}
.tab.hl{outline:3px solid #f59e0b;outline-offset:1px}
.c-dns{--c:var(--dns)}.c-html{--c:var(--html)}.c-css{--c:var(--css)}.c-img{--c:var(--img)}.c-svg{--c:var(--svg)}
.stage{position:relative;height:474px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:0}
.rail{position:absolute;z-index:3;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 8px;pointer-events:none}
@media(max-width:860px){.stage{height:800px}}
.pipe{position:absolute;z-index:1;height:19px;transform-origin:0 50%;overflow:hidden;background:#8e9bb0;border:3px solid var(--c);border-radius:3px;box-shadow:inset 0 2px 4px rgba(0,0,0,.3),0 1px 5px rgba(0,0,0,.4)}
.train{position:absolute;right:100%;top:0;height:100%;display:flex;align-items:center}
.bitsum{flex:none;width:142px;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding-right:3px;white-space:nowrap;font:600 10.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#14181d}
.dots{display:flex;gap:3px}
.dots i{display:block;width:5px;height:5px;border-radius:50%;background:#14181d}
/* a pipe that points left is already upside down; turning the label back leaves its contents in reading order, so pack them against the squares on the left */
.bitsum.flip{transform:rotate(180deg);flex-direction:row-reverse;justify-content:flex-end;padding:0 0 0 3px}
.sq{flex:none;box-sizing:border-box;width:9px;height:9px;margin-right:2px;background:#fff;border:1px solid #14181d}
.sq.on{background:#14181d}
.node{position:absolute;z-index:2;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.node{transition:opacity .5s,filter .5s}
.node.dim{opacity:.45;filter:grayscale(.85)}
.node.arrive{animation:arrive .5s ease-out}
.feint{position:absolute;z-index:0;overflow:hidden;font:10.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;pointer-events:none;
-webkit-mask-image:linear-gradient(to right,#000 78%,transparent);mask-image:linear-gradient(to right,#000 78%,transparent)}
.feint-name{opacity:.55;margin-bottom:4px;font-family:system-ui,sans-serif;font-size:11px}
.fl{white-space:pre;opacity:.34;padding:0 4px;border-radius:3px;transition:opacity .3s,background .3s}
.fl.on{opacity:1;background:var(--hit)}
@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.node.lit{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 25%,transparent)}
.nh{font-weight:600;font-size:15px}
.nlist{display:flex;flex-direction:column;gap:1px;font-size:12px}
.node .nlist{margin-bottom:10px}
.nlist .row{display:flex;justify-content:space-between;gap:8px;padding:1px 6px;border-radius:4px}
.nlist .row.scan,.nlist .row.find{background:color-mix(in srgb,var(--c) 20%,transparent)}
.nlist .row.found,.nlist .row.send{background:color-mix(in srgb,var(--c) 45%,transparent);font-weight:600}
.note{font-size:13px;line-height:1.3;padding:5px 8px;border-radius:6px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 16%,var(--bg));overflow-wrap:anywhere}
.cap{margin:8px 0;padding:8px 14px;border:1px solid var(--line);border-radius:10px;min-height:3.6em}
.cap p{margin:0 0 6px}.cap>p:last-child{margin:0}.cap.good{border-color:var(--good)}.cap.muted{border-style:dashed}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.ctl input[type=range]{flex:1;min-width:120px}
.dev{flex:none;height:113px;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--bg);font-size:12px;line-height:1.3}
.dev-bar{display:flex;align-items:center;gap:8px;padding:0 8px;height:26px;background:var(--chrome);flex:none}
.rec{width:9px;height:9px;border-radius:50%;background:var(--mut)}.rec.on{background:#e5484d}
.dev-filter{margin-left:auto;width:9em;font:inherit;padding:1px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.dev-body{flex:1;overflow-y:scroll;overflow-x:hidden}

.dev-body::-webkit-scrollbar-track{background:color-mix(in srgb,var(--fg) 14%,var(--chrome));border-left:1px solid var(--line)}

.dt{width:100%;border-collapse:separate;border-spacing:0;table-layout:auto}
.dt th{position:sticky;top:0;z-index:2;background:var(--chrome);text-align:left;font-weight:500;padding:0 6px;height:20px;line-height:20px;border-right:1px solid var(--line);white-space:nowrap}
.dt td{padding:0 6px;height:20px;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.dt tbody tr{cursor:default}.dt tbody.live tr{cursor:pointer}.dt tbody.live tr.sel td{background:color-mix(in srgb,var(--acc) 22%,transparent)}.dt tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--fg) 4%,transparent)}

.dt-empty{white-space:normal!important;max-width:none!important;height:auto!important;padding:10px 12px!important;color:var(--mut);cursor:default}
.wf{position:relative;min-width:80px;width:34%;padding:0!important}
.wf-bar{position:absolute;top:6px;height:8px;border-radius:2px;background:var(--c)}.wf-wait{opacity:.4}
.dt-detail{padding:4px 10px}.dt-dh{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.dt-x{font:inherit;border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
.dt-detail dl{display:grid;grid-template-columns:max-content 1fr;gap:1px 12px;margin:0}.dt-detail dt{color:var(--mut)}.dt-detail dd{margin:0;overflow-wrap:anywhere}
@media(max-width:520px){.col-type,.col-time{display:none}}

.src-img{padding:8px;border-top:1px solid var(--line)}.src-pic{display:block;margin:0 auto;max-width:100%;max-height:170px;border-radius:6px}

.vw-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.vw-code{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:4px 0;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto}
.ln.pick{cursor:pointer}.ln.pick:hover{background:color-mix(in srgb,var(--acc) 14%,transparent)}.ln.on{background:var(--hit)}
.vw-col{display:flex;flex-direction:column;gap:6px}
.vw-ed{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vw-in{font:inherit;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-width:14em}
.css-ed{flex:1;min-height:160px;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:auto}
.css-ed:focus-within{border-color:var(--acc)}
.css-in{position:relative;min-width:100%;width:max-content;min-height:100%}
.css-pre,.css-ta{margin:0;padding:8px 10px;border:0;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2;white-space:pre}
.css-pre{min-height:160px;pointer-events:none}
.css-ta{position:absolute;inset:0;width:100%;height:100%;resize:none;overflow:hidden;background:transparent;color:transparent;caret-color:var(--fg);outline:none}
.k-sel{color:var(--tag)}.k-prop{color:var(--acc)}.k-val{color:var(--fg)}.k-num{color:var(--str)}.k-pun{color:var(--mut)}

.ln{padding:0 12px;white-space:pre}.ln.on{background:var(--hit)}
.k-tag{color:var(--tag)}.k-att{color:var(--att)}.k-str{color:var(--str)}
pre.code:not(:has(.ln)){padding:6px 12px;white-space:pre}

<div id="app"><p style="padding:16px">Loading…</p></div>
<noscript><p style="padding:16px">This page needs JavaScript.</p></noscript>
<script type="module">
/* ---- Hyperapp 2.0.22 (MIT, https://github.com/jorgebucaran/hyperapp), included so this page works with no internet ---- */
var SSR_NODE = 1
var TEXT_NODE = 3
var EMPTY_OBJ = {}
var EMPTY_ARR = []
var SVG_NS = "http://www.w3.org/2000/svg"

var id = (a) => a
var map = EMPTY_ARR.map
var isArray = Array.isArray
var enqueue =
  typeof requestAnimationFrame !== "undefined"
    ? requestAnimationFrame
    : setTimeout

var createClass = (obj) => {
  var out = ""

  if (typeof obj === "string") return obj

  if (isArray(obj)) {
    for (var k = 0, tmp; k < obj.length; k++) {
      if ((tmp = createClass(obj[k]))) {
        out += (out && " ") + tmp
      }
    }
  } else {
    for (var k in obj) {
      if (obj[k]) out += (out && " ") + k
    }
  }

  return out
}

var shouldRestart = (a, b) => {
  for (var k in { ...a, ...b }) {
    if (typeof (isArray(a[k]) ? a[k][0] : a[k]) === "function") {
      b[k] = a[k]
    } else if (a[k] !== b[k]) return true
  }

var patchSubs = (oldSubs, newSubs = EMPTY_ARR, dispatch) => {
  for (
    var subs = [], i = 0, oldSub, newSub;
    i < oldSubs.length || i < newSubs.length;
    i++
  ) {
    oldSub = oldSubs[i]
    newSub = newSubs[i]

    subs.push(
      newSub && newSub !== true
        ? !oldSub ||
          newSub[0] !== oldSub[0] ||
          shouldRestart(newSub[1], oldSub[1])
          ? [
              newSub[0],
              newSub[1],
              (oldSub && oldSub[2](), newSub[0](dispatch, newSub[1])),
            ]
          : oldSub
        : oldSub && oldSub[2]()
    )
  }
  return subs
}

var getKey = (vdom) => (vdom == null ? vdom : vdom.key)

var patchProperty = (node, key, oldValue, newValue, listener, isSvg) => {
  if (key === "style") {
    for (var k in { ...oldValue, ...newValue }) {
      oldValue = newValue == null || newValue[k] == null ? "" : newValue[k]
      if (k[0] === "-") {
        node[key].setProperty(k, oldValue)
      } else {
        node[key][k] = oldValue
      }
    }
  } else if (key[0] === "o" && key[1] === "n") {
    if (
      !((node.events || (node.events = {}))[(key = key.slice(2))] = newValue)
    ) {
      node.removeEventListener(key, listener)
    } else if (!oldValue) {
      node.addEventListener(key, listener)
    }
  } else if (!isSvg && key !== "list" && key !== "form" && key in node) {
    node[key] = newValue == null ? "" : newValue
  } else if (newValue == null || newValue === false) {
    node.removeAttribute(key)
  } else {
    node.setAttribute(key, newValue)
  }

var createNode = (vdom, listener, isSvg) => {
  var props = vdom.props
  var node =
    vdom.type === TEXT_NODE
      ? document.createTextNode(vdom.tag)
      : (isSvg = isSvg || vdom.tag === "svg")
      ? document.createElementNS(SVG_NS, vdom.tag, props.is && props)
      : document.createElement(vdom.tag, props.is && props)

  for (var k in props) {
    patchProperty(node, k, null, props[k], listener, isSvg)
  }

  for (var i = 0; i < vdom.children.length; i++) {
    node.appendChild(
      createNode(
        (vdom.children[i] = maybeVNode(vdom.children[i])),
        listener,
        isSvg
      )
    )
  }

  return (vdom.node = node)
}

var patch = (parent, node, oldVNode, newVNode, listener, isSvg) => {
  if (oldVNode === newVNode) {
  } else if (
    oldVNode != null &&
    oldVNode.type === TEXT_NODE &&
    newVNode.type === TEXT_NODE
  ) {
    if (oldVNode.tag !== newVNode.tag) node.nodeValue = newVNode.tag
  } else if (oldVNode == null || oldVNode.tag !== newVNode.tag) {
    node = parent.insertBefore(
      createNode((newVNode = maybeVNode(newVNode)), listener, isSvg),
      node
    )
    if (oldVNode != null) {
      parent.removeChild(oldVNode.node)
    }
  } else {
    var tmpVKid
    var oldVKid

    var oldKey
    var newKey

    var oldProps = oldVNode.props
    var newProps = newVNode.props

    var oldVKids = oldVNode.children
    var newVKids = newVNode.children

    var oldHead = 0
    var newHead = 0
    var oldTail = oldVKids.length - 1
    var newTail = newVKids.length - 1

      }
    }

    while (newHead <= newTail && oldHead <= oldTail) {
      if (
        (oldKey = getKey(oldVKids[oldHead])) == null ||
        oldKey !== getKey(newVKids[newHead])
      ) {
        break
      }

      patch(
        node,
        oldVKids[oldHead].node,
        oldVKids[oldHead],
        (newVKids[newHead] = maybeVNode(
          newVKids[newHead++],
          oldVKids[oldHead++]
        )),
        listener,
        isSvg
      )
    }

    while (newHead <= newTail && oldHead <= oldTail) {
      if (
        (oldKey = getKey(oldVKids[oldTail])) == null ||
        oldKey !== getKey(newVKids[newTail])
      ) {
        break
      }

      patch(
        node,
        oldVKids[oldTail].node,
        oldVKids[oldTail],
        (newVKids[newTail] = maybeVNode(
          newVKids[newTail--],
          oldVKids[oldTail--]
        )),
        listener,
        isSvg
      )
    }

    if (oldHead > oldTail) {
      while (newHead <= newTail) {
        node.insertBefore(
          createNode(
            (newVKids[newHead] = maybeVNode(newVKids[newHead++])),
            listener,
            isSvg
          ),
          (oldVKid = oldVKids[oldHead]) && oldVKid.node
        )
      }
    } else if (newHead > newTail) {
      while (oldHead <= oldTail) {
        node.removeChild(oldVKids[oldHead++].node)
      }
    } else {
      for (var keyed = {}, newKeyed = {}, i = oldHead; i <= oldTail; i++) {
        if ((oldKey = oldVKids[i].key) != null) {
          keyed[oldKey] = oldVKids[i]
        }
      }

      while (newHead <= newTail) {
        oldKey = getKey((oldVKid = oldVKids[oldHead]))
        newKey = getKey(
          (newVKids[newHead] = maybeVNode(newVKids[newHead], oldVKid))
        )

        if (
          newKeyed[oldKey] ||
          (newKey != null && newKey === getKey(oldVKids[oldHead + 1]))
        ) {
          if (oldKey == null) {
            node.removeChild(oldVKid.node)
          }
          oldHead++
          continue
        }

        if (newKey == null || oldVNode.type === SSR_NODE) {
          if (oldKey == null) {
            patch(
              node,
              oldVKid && oldVKid.node,
              oldVKid,
              newVKids[newHead],
              listener,
              isSvg
            )
            newHead++
          }
          oldHead++
        } else {
          if (oldKey === newKey) {
            patch(
              node,
              oldVKid.node,
              oldVKid,
              newVKids[newHead],
              listener,
              isSvg
            )
            newKeyed[newKey] = true
            oldHead++
          } else {
            if ((tmpVKid = keyed[newKey]) != null) {
              patch(
                node,
                node.insertBefore(tmpVKid.node, oldVKid && oldVKid.node),
                tmpVKid,
                newVKids[newHead],
                listener,
                isSvg
              )
              newKeyed[newKey] = true
            } else {
              patch(
                node,
                oldVKid && oldVKid.node,
                null,
                newVKids[newHead],
                listener,
                isSvg
              )
            }
          }
          newHead++
        }
      }

      while (oldHead <= oldTail) {
        if (getKey((oldVKid = oldVKids[oldHead++])) == null) {
          node.removeChild(oldVKid.node)
        }
      }

      for (var i in keyed) {
        if (newKeyed[i] == null) {
          node.removeChild(keyed[i].node)
        }
      }
    }
  }

  return (newVNode.node = node)
}

var propsChanged = (a, b) => {
  for (var k in a) if (a[k] !== b[k]) return true
  for (var k in b) if (a[k] !== b[k]) return true
}

  newVNode !== true && newVNode !== false && newVNode
    ? typeof newVNode.tag === "function"
      ? ((!oldVNode ||
          oldVNode.memo == null ||
          propsChanged(oldVNode.memo, newVNode.memo)) &&
          ((oldVNode = newVNode.tag(newVNode.memo)).memo = newVNode.memo),

  node.nodeType === TEXT_NODE
    ? text(node.nodeValue, node)
    : createVNode(
        node.nodeName.toLowerCase(),
        EMPTY_OBJ,
        map.call(node.childNodes, recycleNode),
        SSR_NODE,
        node
      )

var createVNode = (tag, { key, ...props }, children, type, node) => ({
  tag,
  props,
  key,
  children,
  type,
  node,
})

var memo = (tag, memo) => ({ tag, memo })

var text = (value, node) =>
  createVNode(value, EMPTY_OBJ, EMPTY_ARR, TEXT_NODE, node)

var h = (tag, { class: c, ...props }, children = EMPTY_ARR) =>
  createVNode(
    tag,
    { ...props, ...(c ? { class: createClass(c) } : EMPTY_OBJ) },
    isArray(children) ? children : [children]
  )

  node,
  view,
  subscriptions,
  dispatch = id,
  init = EMPTY_OBJ,

  var subs = []
  var state

    if (state !== newState) {
      if ((state = newState) == null) dispatch = subscriptions = render = id
      if (subscriptions) subs = patchSubs(subs, subscriptions(state), dispatch)
      if (view && !busy) enqueue(render, (busy = true))
    }

  var render = () =>
    (node = patch(
      node.parentNode,
      node,
      vdom,
      (vdom = view(state)),
      listener,
      (busy = false)
    ))

  var listener = function (event) {
    dispatch(this.events[event.type], event)
  }

  return (
    (dispatch = dispatch((action, props) =>
      typeof action === "function"
        ? dispatch(action(state, props))
        : isArray(action)
        ? typeof action[0] === "function"

          : action
              .slice(1)
              .map(
                (fx) => fx && fx !== true && (fx[0] || fx)(dispatch, fx[1]),

  `  <title>${d.title}</title>`,
  '  <link rel="stylesheet" href="style.css">',
  "</head>",
  "<body>",
  `  <${d.tag}>${d.heading}</${d.tag}>`,
  `  <img src="${PIC}" alt="${d.alt.pic}">`,
  `  <img src="${SVG}" alt="${d.alt.svg}">`,

]
const HL_OF_LINE = { 3: "title", 4: "link", 6: "body", 7: "h1", 8: "pic", 9: "svg" } // which lines can be clicked
const HTML_TEXT = htmlLines(ORIGINAL).join("\n")
const CSS_TEXT = ORIGINAL.css
// Whatever a student types as CSS is cleaned before it is used: no @import, no url(), no angle brackets.
const safeCss = (c) => c.replace(/@import[^;]*;?/gi, "").replace(/url\s*\([^)]*\)/gi, "none").replace(/expression\s*\(/gi, "").replace(/[<>]/g, "")

// What happens, with start and end times in seconds. Events with from/to are boxes travelling between computers.
const EV = [

    cap: "<img> is a picture. The browser leaves a space for it and asks for the image file, " + PIC + "." },
  { id: "imgReq", t0: 15.4, t1: 16.4, from: "browser", to: "server", lane: 2, kind: "img" },

  { id: "imgRep", t0: 17.2, t1: 18.4, from: "server", to: "browser", lane: 2, kind: "img", step: "The image arrives",
    cap: "The image arrives and fills its space." },

const BY = Object.fromEntries(EV.map((e) => [e.id, e]))
const TOTAL = 20.8

// Notes: text shown on the computer where the action is happening, while t0 <= time < t1.
const NOTES = [

// ---------- Actions ----------
const focusGo = () => {
  if (matchMedia("(hover: none)").matches) return
  requestAnimationFrame(() => requestAnimationFrame(() => { const b = document.querySelector(".go"); if (b && !b.disabled) b.focus({ preventScroll: true }) }))
}
// The button in the address bar is Go the first time and Reload after that: either way, load the page from the start.
const Go = (s) => ({ ...s, mode: "running", time: 0, last: 0, playing: true, doc: ORIGINAL, file: null, hl: null }) // a reload fetches the original files again
const Toggle = (s) => (s.time >= TOTAL ? { ...s, time: 0, last: 0, playing: true, doc: ORIGINAL, file: null, hl: null } : { ...s, playing: !s.playing, last: 0 })
const Speed = (s, v) => ({ ...s, speed: v })
const SpaceKey = (s) => (s.mode === "running" ? Toggle(s) : s)
// Once the page has loaded: look inside a file, click a line of the HTML to see it in the page, and change a few things.
const OpenFile = (s, id) => (s.mode === "running" && done(s.time, "svgRep") ? { ...s, file: id, hl: null } : s)
const Hl = (s, what) => ({ ...s, hl: s.hl === what ? null : what })
const SetTitle = (s, e) => ({ ...s, doc: { ...s.doc, title: plain(e.target.value, 40) } })
// Typed text is kept plain: no angle brackets or quote marks, so it cannot break the HTML it is put into.
const plain = (v, n) => v.replace(/[<>"]/g, "").slice(0, n)
const SetHeading = (s, e) => ({ ...s, doc: { ...s.doc, heading: plain(e.target.value, 60) } })
const SetAlt = (which) => (s, e) => ({ ...s, doc: { ...s.doc, alt: { ...s.doc.alt, [which]: plain(e.target.value, 80) } } })
const SetAltPic = SetAlt("pic")
const SetAltSvg = SetAlt("svg")
const SetTag = (s, tag) => ({ ...s, doc: { ...s.doc, tag } })
const SetCss = (s, e) => ({ ...s, doc: { ...s.doc, css: e.target.value.slice(0, 2000) } })
const ResetDoc = (s) => ({ ...s, doc: ORIGINAL })
const SetFilter = (s, e) => ({ ...s, filter: e.target.value })
const Scrub = (s, e) => ({ ...s, time: Number(e.target.value), playing: false, last: 0 })
const Tick = (s, ts) => {
  if (!s.playing) return s
  const time = s.time + (s.last ? Math.min(ts - s.last, 64) : 0) * s.speed / 1000
  return time >= TOTAL ? { ...s, time: TOTAL, playing: false, last: 0 } : { ...s, time, last: ts }
}
const raf = (dispatch) => {
  let id
  const loop = (ts) => { dispatch(Tick, ts); id = requestAnimationFrame(loop) }
  id = requestAnimationFrame(loop)
  return () => cancelAnimationFrame(id)
}

// ---------- Helpers for the view ----------
const el = (tag, props, kids) => h(tag, props || {}, [].concat(kids == null ? [] : kids).filter((k) => k != null && k !== false).map((k) => (typeof k === "string" ? text(k) : k)))
const started = (t, id) => t >= BY[id].t0
const done = (t, id) => t >= BY[id].t1
const active = (t, e) => t >= e.t0 && t < e.t1

// The browser's page is a real little document, rebuilt from whatever has arrived so far (and from any edits).
const esc = (v) => v.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;")
function pageDoc(t, doc, hl) {
  const h1 = started(t, "pH1"), css = done(t, "cssRep")
  const pic = done(t, "imgRep") ? 2 : started(t, "pImg") ? 1 : 0
  const svg = done(t, "svgRep") ? 2 : started(t, "pSvg") ? 1 : 0
  const mark = (k) => (hl === k ? ' class="hl"' : "")
  const hole = (px) => `<div style="width:50%;max-width:120px;height:${px}px;border:2px dashed #999;margin:6px auto"></div>`
  return `<!doctype html><meta charset=utf-8><style>${css ? safeCss(doc.css) : ""}</style><style>.hl{outline:3px solid #f59e0b;outline-offset:3px}</style><body style="margin:14px">` +
    (h1 ? `<${doc.tag}${mark("h1")}>${esc(doc.heading)}</${doc.tag}>` : "") +
    (pic === 2 ? `<img${mark("pic")} src="${URL_OF(PIC)}" alt="${esc(doc.alt.pic)}" title="${esc(doc.alt.pic)}">` : pic === 1 ? hole(76) : "") +
    (svg === 2 ? `<img${mark("svg")} src="${URL_OF(SVG)}" alt="${esc(doc.alt.svg)}" title="${esc(doc.alt.svg)}">` : svg === 1 ? hole(64) : "")
}

// CSS with colour: selectors, property names, values, numbers and colours, comments.
function highlightCss(code) {
  const out = []
  let depth = 0, m
  const re = /(\/\*[\s\S]*?\*\/)|("[^"]*"|'[^']*')|(#[0-9a-fA-F]{3,8}\b)|(-?\d*\.?\d+[a-z%]*)|([.#]?[A-Za-z_-][\w-]*)|([{}:;,])|(\s+|[\s\S])/g
  const put = (cls, s) => out.push(cls ? el("span", { class: cls }, s) : text(s))
  while ((m = re.exec(code))) {
    const tok = m[0]
    if (m[1]) put("k-com", tok)
    else if (m[2]) put("k-str", tok)
    else if (m[3]) put(depth ? "k-num" : "k-sel", tok)
    else if (m[4]) put(depth ? "k-num" : "", tok)
    else if (m[5]) put(depth === 0 ? "k-sel" : /^\s*:/.test(code.slice(re.lastIndex)) ? "k-prop" : "k-val", tok)
    else if (m[6]) { if (tok === "{") depth++; if (tok === "}") depth = Math.max(0, depth - 1); put("k-pun", tok) }
    else put("", tok)
  }
  out.push(text(" "))
  return out
}

// HTML source with colour, one line per row; the line being read is highlighted.
function colourLine(line) {
  const out = []
  const re = /(<\/?[A-Za-z!][^\s>]*|>)|([A-Za-z-]+)(?==)|("[^"]*")/g
  let last = 0, m
  while ((m = re.exec(line))) {
    if (m.index > last) out.push(text(line.slice(last, m.index)))
    out.push(el("span", { class: m[1] ? "k-tag" : m[2] ? "k-att" : "k-str" }, m[0]))
    last = re.lastIndex
  }
  if (last < line.length) out.push(text(line.slice(last)))
  return out
}

// Where things sit, as % of the stage (left, top, width, height). The real browser window is the browser, and its
// notes are drawn on top of it (the `rail`, centred half-way down). Lines and boxes leave from `anchor`: the right edge
// of the browser pane, half-way down it (wide); the bottom of the pane (narrow).
const GEO = {
  wide: { win: [0, 0, 46, 100], rail: [25, 0, 20, 100], dns: [70, 2, 28, 36], server: [70, 42, 28, 44], feint: [47, 3, 22.5, 94], viewer: [49, 2, 49, 96], anchor: [46, 50], lane: "y" },
  narrow: { win: [0, 0, 100, 58], rail: [8, 0, 84, 58], dns: [4, 61, 92, 18], server: [4, 80, 92, 19], viewer: [3, 60, 94, 39], anchor: [50, 58], lane: "x" },
}
const px = ([l, t, w, h]) => ({ left: l + "%", top: t + "%", width: w + "%", ...(h != null ? { height: h + "%" } : {}) })
const centre = (g, n) => (n === "browser" ? g.anchor : [g[n][0] + g[n][2] / 2, g[n][1] + g[n][3] / 2])
const LANE = [0, -5.5, 5.5] // the three roads between browser and server

function route(g, e, f) {
  const [x0, y0] = centre(g, e.from), [x1, y1] = centre(g, e.to)
  const o = e.lane == null ? 0 : LANE[e.lane] * (g.lane === "y" ? 1 : 1.9)
  const ox = g.lane === "x" ? o : 0, oy = g.lane === "y" ? o : 0
  return { x: x0 + (x1 - x0) * f + ox, y: y0 + (y1 - y0) * f + oy, x0: x0 + ox, y0: y0 + oy, x1: x1 + ox, y1: y1 + oy }
}

// What the DNS server knows (a few names and their addresses, all from ranges reserved for examples) and what the web
// server holds. While a request is handled the matching row is picked out: found in the book and sent back, or found
// among the files and sent.
const DNS_BOOK = [["www.example.com", "192.0.2.10"], ["news.example.net", "198.51.100.7"], [SITE, IP], ["shop.example.org", "192.0.2.77"]]
const BOOK_TARGET = 2
const SERVER_FILES = [
  { name: "index.html", bytes: HTML_TEXT.length, kind: "html", find: "serverFind", rep: "htmlRep" },
  { name: "style.css", bytes: CSS_TEXT.length, kind: "css", find: "cssLook", rep: "cssRep" },
  { name: PIC, bytes: PIC_BYTES, kind: "img", find: "imgLook", rep: "imgRep" },
  { name: SVG, bytes: SVG_BYTES, kind: "svg", find: "svgLook", rep: "svgRep" },
]
const sizeText = (b) => (b < 1000 ? b + " B" : (b / 1000).toFixed(b < 10000 ? 1 : 0) + " kB")

function dnsBook(t) {
  const L = BY.dnsLook
  let idx = -1, mode = ""
  if (t >= L.t0 && t < L.t1) { idx = Math.min(BOOK_TARGET, Math.floor((t - L.t0) / 0.3)); mode = idx === BOOK_TARGET ? "found" : "scan" }
  else if (t >= BY.dnsRep.t0 && t < BY.dnsRep.t1) { idx = BOOK_TARGET; mode = "sent" }
  return el("div", { key: "list", class: "nlist c-dns" }, DNS_BOOK.map(([n, ad], i) =>
    el("div", { class: "row " + (i === idx ? mode : "") }, [el("span", {}, n), el("span", { class: "m" }, ad)])))
}

function serverFiles(t) {
  return el("div", { key: "list", class: "nlist" }, SERVER_FILES.map((f) => {
    const mode = t >= BY[f.find].t0 && t < BY[f.rep].t1 ? "send" : ""
    return el("div", { class: `row c-${f.kind} ${mode}` }, [el("span", {}, f.name), el("span", { class: "m" }, sizeText(f.bytes))])
  }))
}

const noteEl = (doc) => (o) => el("div", { key: o.at + o.t0, class: "note c-" + o.kind }, typeof o.text === "function" ? o.text(doc) : o.text)

// The page the browser has just received, shown faintly in the blank area behind the diagram while it is being read; the
// line being talked about lights up. Once the page is complete the same file is on the right (the viewer), so this goes.
const READ_LINE = { pTitle: 3, pLink: 4, pH1: 7, pImg: 8, pSvg: 9 } // timeline event -> line of index.html it is about
function feintSource(s, t, g) {
  const now = Object.keys(READ_LINE).find((id) => active(t, BY[id]))
  const at = now == null ? -1 : READ_LINE[now]
  return el("div", { key: "feint", class: "feint", style: px(g.feint) }, [
    el("div", { key: "name", class: "feint-name" }, "index.html (received)"),
    ...htmlLines(s.doc).map((ln, i) => el("div", { key: i, class: i === at ? "fl on" : "fl" }, [...colourLine(ln), text(" ")])),
  ])
}

// A transfer is drawn like the pipe in network1: a pipe with a border in the transfer's colour that runs the whole way from
// the sender to the receiver, and a stream of black (1) and white (0) squares that travels along it at a steady pace, in at
// the sender's end and out at the receiver's. Each square keeps its colour. The stream is always longer than the stretch of
// pipe you can see (so for a moment the whole pipe is full of bits); replies are longer the bigger the file is. Behind the
// last square come three dots and then a count of the bits sent so far, which ends at the size of the transfer.
const SQ = 11 // px from one square to the next
const LABEL_W = 142 // px reserved behind the squares for the three dots and the bit count
const FACTOR = { dnsReq: 1, dnsRep: 1, htmlReq: 1, htmlRep: 1.4, cssReq: 1, cssRep: 1.25, imgReq: 1, imgRep: 2.4, svgReq: 1, svgRep: 1.4 }
const REQUEST_BYTES = { dnsReq: 40, dnsRep: 58, htmlReq: 90, cssReq: 90, imgReq: 100, svgReq: 100 } // roughly what a request or answer weighs
const REPLY_ROW = { htmlRep: "html", cssRep: "css", imgRep: "pic", svgRep: "svg" } // a reply is as big as the file it carries
const bitsOf = (e, doc) => 8 * (REPLY_ROW[e.id] ? ROWS.find((r) => r.id === REPLY_ROW[e.id]).bytes(doc) : REQUEST_BYTES[e.id])
const bitAt = (id, i) => { let x = 2166136261; for (const c of id + ":" + i) { x ^= c.charCodeAt(0); x = Math.imul(x, 16777619) } return (x >>> 9) & 1 }
function stream(e, s, t, g) {
  const f = Math.min(1, Math.max(0, (t - e.t0) / (e.t1 - e.t0)))
  const r = route(g, e, 0) // from the sender to the receiver
  const st = document.querySelector(".stage")
  const w = (st && st.clientWidth) || 1148, h = (st && st.clientHeight) || 474
  const dx = ((r.x1 - r.x0) * w) / 100, dy = ((r.y1 - r.y0) * h) / 100 // the route, in pixels as drawn on the screen
  const len = Math.hypot(dx, dy), angle = (Math.atan2(dy, dx) * 180) / Math.PI
  // the stretch you can see runs from the browser pane to the edge of the other pane; the rest is hidden behind that pane
  const node = e.from === "browser" ? e.to : e.from
  const [ax, ay] = g.anchor, [cx, cy] = centre(g, node)
  const u = g.lane === "y" ? (g[node][0] - ax) / (cx - ax) : (g[node][1] - ay) / (cy - ay)
  const visible = Math.min(len, Math.max(0, u) * len)
  const n = Math.ceil((Math.ceil(visible / SQ) + 2) * FACTOR[e.id]) // always at least the visible stretch (+2): the pipe fills completely
  const head = f * (len + n * SQ + LABEL_W) // how far the front of the stream has got along the pipe
  const upsideDown = Math.abs(angle) > 90 // pipes pointing left would show their text upside down, so turn it round
  // bits sent = bits that have left the sender: it counts up while the stream pulls out, then holds the total
  const sent = Math.round(bitsOf(e, s.doc) * Math.min(1, head / (n * SQ + LABEL_W))).toLocaleString("en-US")
  return el("div", { key: "pkt-" + e.id, class: "pipe c-" + e.kind, style: { left: r.x0 + "%", top: `calc(${r.y0}% - 9.5px)`, width: len.toFixed(1) + "px", transform: `rotate(${angle.toFixed(2)}deg)` } },
    el("div", { class: "train", style: { transform: `translateX(${head.toFixed(1)}px)` } }, [
      // behind the last square: three dots (as big as the squares, so they can be seen) and then the count
      el("span", { class: upsideDown ? "bitsum flip" : "bitsum" }, [el("span", {}, `${sent} bits`), el("span", { class: "dots" }, [el("i", {}, ""), el("i", {}, ""), el("i", {}, "")])]),
      ...Array.from({ length: n }, (_, i) => n - 1 - i).map((k) => el("i", { key: k, class: bitAt(e.id, k) ? "sq on" : "sq" }, "")),
    ]))
}

function stage(s) {
  const t = s.mode === "running" ? s.time : -1
  const g = s.narrow ? GEO.narrow : GEO.wide
  const moving = EV.filter((e) => e.from && active(t, e))
  const on = (n) => NOTES.filter((o) => o.at === n && t >= o.t0 && t < o.t1)
  const node = (n, title, extra, list, more) =>
    el("div", { key: n, class: [on(n).length ? "node lit" : "node", more], style: px(g[n]) }, [
      el("div", { key: "head", class: "nh" }, [title, extra && el("span", { class: "m" }, " " + extra)]),
      list,
      ...on(n).map(noteEl(s.doc)),
    ])
  const complete = done(t, "svgRep")
  const knowsIP = done(t, "dnsRep")
  const showFeint = !complete && g.feint && done(t, "htmlRep") // wide screens only; narrow ones have no blank area
  return el("div", { key: "stage", class: "stage" }, [
    showFeint && feintSource(s, t, g),
    // a stream of squares exists only while a transfer is under way
    ...moving.map((e) => stream(e, s, t, g)),
    browserWindow(s, px(g.win)),
    el("div", { key: "rail", class: "rail", style: px(g.rail) }, on("browser").map(noteEl(s.doc))),
    // once the page is complete the servers have nothing more to do: the right-hand side shows the files instead
    // The web server only appears once the browser has its address (the DNS answer is in); the DNS server then fades back.
    ...(complete ? [viewer(s, g)] : [
      node("dns", "DNS server", "", dnsBook(t), knowsIP && "dim"),
      knowsIP && node("server", "Web server", "at " + IP, serverFiles(t), "arrive"),
    ]),
  ])
}

// ---------- A network pane, like the one in a browser's developer tools ----------
const kb = sizeText
const ROWS = [
  { id: "dns", name: SITE, type: "dns", kind: "dns", bytes: () => 58, ask: "dnsReq", got: "dnsRep", mime: "" },
  { id: "html", name: "index.html", type: "document", kind: "html", bytes: (d) => htmlLines(d).join("\n").length, ask: "htmlReq", got: "htmlRep", mime: "text/html", path: "" },
  { id: "css", name: "style.css", type: "stylesheet", kind: "css", bytes: (d) => d.css.length, ask: "cssReq", got: "cssRep", mime: "text/css", path: "style.css" },
  { id: "pic", name: PIC, type: "jpeg", kind: "img", bytes: () => PIC_BYTES, ask: "imgReq", got: "imgRep", mime: "image/jpeg", path: PIC },
  { id: "svg", name: SVG, type: "svg+xml", kind: "svg", bytes: () => SVG_BYTES, ask: "svgReq", got: "svgRep", mime: "image/svg+xml", path: SVG },
]
const span = (r) => ({ s0: BY[r.ask].t0, mid: BY[r.got].t0, end: BY[r.got].t1 }) // sent, reply starts, reply done

function netPane(s) {
  const t = s.mode === "running" ? s.time : -1
  const shown = ROWS.filter((r) => started(t, r.ask))
  const f = (s.filter || "").toLowerCase()
  const rows = shown.filter((r) => !f || r.name.toLowerCase().includes(f))
  const complete = done(t, "svgRep")
  const cur = complete ? s.file || "html" : null // the row whose contents are on show
  const pct = (x) => Math.max(0, Math.min(100, (x / TOTAL) * 100)) + "%"
  const tr = (r) => {
    const { s0, mid, end } = span(r), fin = t >= end
    const wait = [s0, Math.min(t, mid)], get = [mid, Math.min(t, end)]
    return el("tr", { key: r.id, class: "c-" + r.kind + (cur === r.id ? " sel" : ""), onclick: [OpenFile, r.id] }, [
      el("td", { title: r.name }, r.name),
      el("td", {}, fin ? (r.id === "dns" ? "OK" : "200") : "(pending)"),
      el("td", { class: "col-type" }, r.type),
      el("td", {}, fin ? kb(r.bytes(s.doc)) : "—"),
      el("td", { class: "col-time" }, fin ? (end - s0).toFixed(1) + " s" : "…"),
      el("td", { class: "wf" }, [
        el("i", { class: "wf-bar wf-wait", style: { left: pct(wait[0]), width: pct(Math.max(0, wait[1] - wait[0])) } }, ""),
        t > mid && el("i", { class: "wf-bar wf-get", style: { left: pct(get[0]), width: pct(Math.max(0, get[1] - get[0])) } }, ""),
      ]),
    ])
  }
  return el("div", { class: "dev" }, [
    el("div", { class: "dev-bar" }, [
      el("span", { class: s.mode === "running" && !done(t, "svgRep") ? "rec on" : "rec", title: "Recording network activity" }, ""),
      el("b", {}, "Network file transfers"),
      el("input", { class: "dev-filter", placeholder: "Filter", value: s.filter || "", oninput: SetFilter, "aria-label": "Filter requests" }),
    ]),
    el("div", { class: "dev-body", onscroll: PaneScrolled }, el("table", { class: "dt" }, [
      el("thead", {}, el("tr", {}, [el("th", {}, "Name"), el("th", {}, "Status"), el("th", { class: "col-type" }, "Type"), el("th", {}, "Size"), el("th", { class: "col-time" }, "Time"), el("th", {}, "Waterfall")])),
      el("tbody", { class: complete ? "live" : "" }, rows.length ? rows.map(tr) : [el("tr", {}, el("td", { colspan: 6, class: "dt-empty" }, t < 0 ? "Press Go to load the page. Every request will be listed here." : !shown.length ? "Recording network activity… waiting for the first request." : "No requests match the filter."))]),
    ])),
  ])
}

function browserWindow(s, pos) {
  const t = s.time, run = s.mode === "running"
  const title = run ? (t >= BY.pTitle.t0 + 0.5 ? s.doc.title || "Untitled" : done(t, "htmlRep") ? "…" : "Loading…") : "New tab"
  const lit = run && done(t, "svgRep") ? s.hl : null // an element picked in the HTML shows up here
  const spin = run && t < TOTAL
  return el("section", { key: "win", class: "win", style: pos }, [
    el("div", { class: "tabs" }, el("div", { class: lit === "title" ? "tab hl" : "tab" }, [el("span", { class: spin ? "dot spin" : "dot" }, ""), title])),
    el("div", { class: "urlrow" }, [
      el("input", { class: "url-in", value: SITE, readOnly: true, "aria-label": "Address bar" }),
      el("button", { class: "btn primary go", onclick: Go, title: run ? "Reload: load the page again" : "Go", "aria-label": run ? "Reload" : "Go" }, run ? "↻" : "Go ⏎"),
    ]),
    el("div", { class: "bar" }, el("div", { class: "bar-in", style: { width: run ? `${Math.min(100, (t / TOTAL) * 100)}%` : "0%" } }, "")),
    el("div", { class: "viewwrap" }, [
      el("iframe", { key: "view", class: "view", srcdoc: run ? pageDoc(t, s.doc, lit) : "", sandbox: "", title: "The web page, as the browser has built it so far" }),
      (lit === "body" || lit === "link") && el("div", { key: "hlf", class: "hl-frame" }, ""),
    ]),
    netPane(s),
  ])
}

// What the browser received, shown on the right once the page is complete: the file picked in the network pane.
// The alt text is what a screen reader says, and what shows if the picture cannot be loaded; here it also pops up when
// you hover over the picture in the page.
function altEditor(which, action, value) {
  return el("div", { class: "vw-col" }, [
    el("label", { class: "vw-ed" }, ["Alt text: ", el("input", { class: "vw-in", value, oninput: action, maxlength: 80, "aria-label": "Alt text" })]),
    el("div", { class: "vw-ed" }, [el("span", { class: "m" }, "Hover over the picture in the page to see it."), el("button", { class: "btn small", onclick: [OpenFile, which] }, "Open the file")]),
  ])
}

function viewer(s, g) {
  const cur = s.file || "html", d = s.doc
  const row = ROWS.find((r) => r.id === cur)
  const changed = d.title !== ORIGINAL.title || d.tag !== ORIGINAL.tag || d.heading !== ORIGINAL.heading || d.css !== ORIGINAL.css || d.alt.pic !== ORIGINAL.alt.pic || d.alt.svg !== ORIGINAL.alt.svg
  let body
  if (cur === "html") {
    const tips = {
      title: el("label", { class: "vw-ed" }, ["The tab's name: ", el("input", { class: "vw-in", value: d.title, oninput: SetTitle, maxlength: 40, "aria-label": "Page title" })]),
      h1: el("div", { class: "vw-col" }, [
        el("div", { class: "vw-ed" }, ["Heading size: ", ...["h1", "h2", "h3", "h4"].map((tg) => el("button", { class: d.tag === tg ? "btn small on" : "btn small", onclick: [SetTag, tg] }, tg)), el("span", { class: "m" }, "(h1 is biggest)")]),
        el("label", { class: "vw-ed" }, ["The words: ", el("input", { class: "vw-in", value: d.heading, oninput: SetHeading, maxlength: 60, "aria-label": "Heading text" })]),
      ]),
      link: el("div", { class: "vw-ed" }, ["This line fetches the style sheet. ", el("button", { class: "btn small", onclick: [OpenFile, "css"] }, "Open style.css")]),
      body: el("div", { class: "vw-ed m" }, "Everything inside <body> is what you see in the page."),
      pic: altEditor("pic", SetAltPic, d.alt.pic),
      svg: altEditor("svg", SetAltSvg, d.alt.svg),
    }
    body = [
      el("div", { class: "vw-code" }, htmlLines(d).map((ln, i) => {
        const k = HL_OF_LINE[i]
        const props = { key: i, class: "ln" + (k ? " pick" : "") + (k && s.hl === k ? " on" : "") }
        if (k) { props.onclick = [Hl, k]; props.title = "Click to see what this makes in the page" }
        return el("div", props, [...colourLine(ln), text(" ")])
      })),
      s.hl ? tips[s.hl] : el("div", { class: "vw-ed m" }, "Click a highlighted line to see it in the page. You can change some of them."),
    ]
  } else if (cur === "css") {
    body = [
      el("div", { class: "css-ed" }, el("div", { class: "css-in" }, [
        el("pre", { class: "css-pre", "aria-hidden": "true" }, highlightCss(d.css)),
        el("textarea", { class: "css-ta", value: d.css, oninput: SetCss, spellcheck: false, wrap: "off", autocapitalize: "off", autocomplete: "off", "aria-label": "style.css" }),
      ])),
      el("div", { class: "vw-ed m" }, "Change a colour or a size and the page changes. (Pictures and @import are switched off here.)"),
    ]
  } else if (cur === "pic" || cur === "svg") {
    body = el("img", { class: "vw-pic", src: URL_OF(row.path), alt: row.name })
  } else {
    body = el("div", { class: "vw-ed" }, `The DNS server answered: ${SITE} is at ${IP}.`)
  }
  return el("div", { key: "viewer", class: "viewer", style: px(g.viewer) }, [
    el("div", { class: "vw-head" }, [
      el("b", {}, row.name),
      el("span", { class: "m" }, `${kb(row.bytes(d))}${row.mime ? " · " + row.mime : ""}`),
      changed && el("button", { class: "btn small", onclick: ResetDoc, title: "Put the files back as the server sent them" }, "Undo my changes"),
    ]),
    ...[].concat(body),
  ])
}

function controls(s) {
  const run = s.mode === "running"
  return el("div", { key: "ctl", class: "ctl" }, [
    el("button", { class: "btn small", onclick: Toggle, disabled: !run, title: "Space bar does this too" }, s.playing ? "❚❚ Pause" : s.time >= TOTAL ? "↺ Replay" : "▶ Play"),
    el("input", { type: "range", min: 0, max: TOTAL, step: 0.05, value: s.time, oninput: Scrub, disabled: !run, "aria-label": "Move through the steps" }),
    ...[0.5, 1, 2].map((v) => el("button", { class: s.speed === v ? "btn small on" : "btn small", onclick: [Speed, v] }, `${v}×`)),
  ])
}

function caption(s) {
  if (s.mode === "idle") return null
  if (done(s.time, "svgRep")) return el("p", { key: "cap", class: "cap good" }, `Done! The page was built from four files: index.html, style.css, ${PIC} and ${SVG}, all fetched from the address the DNS server gave us.`)
  return el("div", { key: "cap", class: "cap" }, EV.filter((e) => e.cap && active(s.time, e)).map((e) => el("p", {}, e.cap)))
}

const view = (s) => {
  return el("main", { class: "wrap" }, [
    el("header", { key: "top", class: "top" }, [el("a", { href: HOME.href, class: "back" }, HOME.label), el("h1", {}, "Network2: loading a web page")]),
    stage(s),
    caption(s),
    controls(s),
  ])
}

// Space bar pauses and restarts the animation. It is only taken over while a page is loading, so it still scrolls the page
// the rest of the time, and it is left alone when you are typing in the filter box.
const watchKeys = (dispatch, props) => {
  if (!props.on) return () => {}
  const typing = (e) => e.target && (e.target.tagName === "TEXTAREA" || (e.target.tagName === "INPUT" && e.target.type !== "range" && e.target.type !== "button"))
  const isSpace = (e) => e.code === "Space" || e.key === " "
  const down = (e) => { if (isSpace(e) && !typing(e)) { e.preventDefault(); if (!e.repeat) dispatch(SpaceKey) } }
  const up = (e) => { if (isSpace(e) && !typing(e)) e.preventDefault() } // stops a focused button from also "clicking"
  document.addEventListener("keydown", down)
  document.addEventListener("keyup", up)
  return () => { document.removeEventListener("keydown", down); document.removeEventListener("keyup", up) }
}

// The network pane shows three rows at a time and follows new requests, like a log: it stays at the bottom until you
// scroll up to look at something older, and goes back to following when you scroll down to the end again.
let follow = true
const PaneScrolled = (s, e) => {
  const b = e.target
  follow = b.scrollTop + b.clientHeight >= b.scrollHeight - 6
  return s
}
const followRows = (dispatch, props) => {
  if (props.n === 0) follow = true
  const toEnd = () => { const b = document.querySelector(".dev-body"); if (b) b.scrollTop = b.scrollHeight }
  if (follow) setTimeout(toEnd, 0), requestAnimationFrame(() => requestAnimationFrame(toEnd))
  return () => {}
}

// Narrow screens stack the pieces instead of putting them side by side (same breakpoint as the CSS).
const NARROW = "(max-width: 860px)"
const watchWidth = (dispatch) => {
  const mq = matchMedia(NARROW)
  const f = () => dispatch(SetNarrow, mq.matches)
  mq.addEventListener("change", f)
  return () => mq.removeEventListener("change", f)
}
const SetNarrow = (s, narrow) => ({ ...s, narrow })

app({
  node: document.getElementById("app"),
  init: [{ mode: "idle", time: 0, last: 0, playing: false, speed: START_SPEED, narrow: matchMedia(NARROW).matches, doc: ORIGINAL, file: null, hl: null, filter: "" }, [focusGo]],
  view,
  subscriptions: (s) => [s.mode === "running" && s.playing && [raf, {}], [watchWidth, {}], [watchKeys, { on: s.mode === "running" }],
    [followRows, { n: s.mode === "running" ? ROWS.filter((r) => started(s.time, r.ask)).length : 0 }]],
})

</script>
</body></html>
